<div class="card">
    <div class="card-header">
        <h3>Child Component</h3>
    </div>
    <div class="card-body">
        <ul>
            <li *ngFor="let item of items; let i = index">
                {{item}}
                <button class="btn btn-danger" (click)="deleteIndex(i)">Delete</button>
            </li>
        </ul>
    </div>
</div>
