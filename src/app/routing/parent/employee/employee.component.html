<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Department</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let emp of employees">
            <td><a href="#" [routerLink]="['/employee',emp.empName, emp.empId]">{{emp.empDept}}</a></td>
        </tr>
    </tbody>
</table>
